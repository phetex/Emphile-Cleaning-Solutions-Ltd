<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Emphile Cleaning Solutions Ltd</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-mark">EC</div>
    <span class="nav-logo-text">Emphile<small>CLEANING SOLUTIONS</small></span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>
<div class="portal-wrap">
  <div class="portal-header">
    <div>
      <h1 id="welcomeTitle">Welcome</h1>
      <p id="welcomeSub">Loading your account…</p>
    </div>
    <button class="btn-logout" id="logoutBtn">Log out</button>
  </div>
  <div id="content">
    <div class="loading-state">Loading your invoices…</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
  const SUPABASE_FN_URL = 'https://izjsoqcpzqxbmluzsepu.supabase.co/functions/v1/verify-payment';
  const PAYSTACK_PUBLIC_KEY = 'pk_live_578e9b28b6489b94b117bdd5e5e24718f0c59460';

  const welcomeTitle = document.getElementById('welcomeTitle');
  const welcomeSub = document.getElementById('welcomeSub');
  const content = document.getElementById('content');
  const logoutBtn = document.getElementById('logoutBtn');
  let currentUserEmail = '';

  function fmtNaira(n) {
    return '₦' + Number(n).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    const user = session.user;

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('full_name, phone')
      .eq('id', user.id)
      .single();

    const name = profile && profile.full_name ? profile.full_name : user.email;
    welcomeTitle.textContent = 'Welcome, ' + name;
    welcomeSub.textContent = user.email;
    currentUserEmail = user.email;

    await loadInvoices();
  })();

  async function loadInvoices() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const user = session.user;

    const { data: invoices, error } = await supabaseClient
      .from('invoices')
      .select('id, service_type, job_date, amount, status, notes')
      .eq('customer_id', user.id)
      .order('job_date', { ascending: false });

    if (error) {
      content.innerHTML = '<div class="empty-state">Couldn\'t load invoices right now. Please try again shortly.</div>';
      return;
    }

    if (!invoices || invoices.length === 0) {
      content.innerHTML = '<div class="empty-state">No invoices yet. Once you book a service, it will appear here.</div>';
      return;
    }

    const rows = invoices.map((inv) => `
      <tr>
        <td>${inv.service_type}</td>
        <td>${fmtDate(inv.job_date)}</td>
        <td>${fmtNaira(inv.amount)}</td>
        <td><span class="status-pill status-${inv.status}">${inv.status}</span></td>
        <td>${inv.status !== 'Paid' ? `<button class="btn-pay" data-id="${inv.id}" data-amount="${inv.amount}">Pay Now</button>` : ''}</td>
      </tr>
    `).join('');

    content.innerHTML = `
      <table class="invoice-table">
        <thead>
          <tr><th>Service</th><th>Job date</th><th>Amount</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    content.querySelectorAll('.btn-pay').forEach((btn) => {
      btn.addEventListener('click', () => payInvoice(btn.getAttribute('data-id'), parseFloat(btn.getAttribute('data-amount')), btn));
    });
  }

  function payInvoice(invoiceId, amount, btn) {
    const handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: currentUserEmail,
      amount: Math.round(amount * 100),
      currency: 'NGN',
      ref: 'EMP-' + invoiceId.slice(0, 8) + '-' + Date.now(),
      callback: function (response) {
        btn.textContent = 'Verifying…';
        btn.disabled = true;
        fetch(SUPABASE_FN_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'apikey': SUPABASE_KEY,
          },
          body: JSON.stringify({ reference: response.reference, invoiceId: invoiceId }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              loadInvoices();
            } else {
              alert('Payment received but verification failed. Please contact us with reference: ' + response.reference);
            }
          })
          .catch(() => {
            alert('Payment received but verification failed. Please contact us with reference: ' + response.reference);
          });
      },
      onClose: function () {},
    });
    handler.openIframe();
  }
</script>
</body>
</html>
