<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Emphile Cleaning Solutions Ltd</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-mark">EC</div>
    <span class="nav-logo-text">Emphile<small>CLEANING SOLUTIONS</small></span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>
<main>
  <div class="auth-card" id="loadingCard">
    <h1 class="auth-title">Verifying reset link…</h1>
    <p class="auth-sub">One moment please.</p>
  </div>

  <div class="auth-card" id="formCard" style="display:none;">
    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>
    <div class="alert alert-error" id="errorAlert"></div>
    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">NEW PASSWORD</label>
        <input type="password" class="form-input" id="newPassword" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label">CONFIRM PASSWORD</label>
        <input type="password" class="form-input" id="confirmPassword" minlength="6" required>
      </div>
      <button type="submit" class="form-submit" id="submitBtn">Update password</button>
    </form>
  </div>

  <div class="auth-card" id="invalidCard" style="display:none;">
    <h1 class="auth-title">Link expired or invalid</h1>
    <p class="auth-sub">This password reset link is no longer valid. Please request a new one.</p>
    <a href="login.html" class="form-submit" style="display:block;text-align:center;text-decoration:none;">Back to log in</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  const loadingCard = document.getElementById('loadingCard');
  const formCard = document.getElementById('formCard');
  const invalidCard = document.getElementById('invalidCard');
  const resetForm = document.getElementById('resetForm');
  const errorAlert = document.getElementById('errorAlert');
  const submitBtn = document.getElementById('submitBtn');

  let recoveryReady = false;

  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      loadingCard.style.display = 'none';
      formCard.style.display = 'block';
    }
  });

  (async () => {
    await new Promise((r) => setTimeout(r, 1500));
    if (recoveryReady) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      loadingCard.style.display = 'none';
      formCard.style.display = 'block';
    } else {
      loadingCard.style.display = 'none';
      invalidCard.style.display = 'block';
    }
  })();

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorAlert.classList.remove('show');

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      errorAlert.textContent = 'Passwords do not match.';
      errorAlert.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
      errorAlert.textContent = error.message;
      errorAlert.classList.add('show');
      return;
    }

    submitBtn.textContent = '✓ Password updated — redirecting…';
    await supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  });
</script>
</body>
</html>
