<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login | Emphile Cleaning Solutions Ltd</title>
<meta name="description" content="Log in to your Emphile Cleaning Solutions account to view your bookings and invoices.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-mark">EC</div>
    <span class="nav-logo-text">Emphile<small>CLEANING SOLUTIONS</small></span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="signup.html">Sign up</a></li>
  </ul>
</nav>
<main>
  <div class="auth-card">
    <h1 class="auth-title">Client login</h1>
    <p class="auth-sub">Log in to view your bookings and invoices.</p>
    <div class="alert alert-error" id="errorAlert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">EMAIL ADDRESS</label>
        <input type="email" class="form-input" id="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input type="password" class="form-input" id="password" autocomplete="current-password" required>
      </div>
      <label class="remember-row"><input type="checkbox" id="rememberMe" checked><span>Remember me on this device</span></label>
      <button type="submit" class="form-submit" id="submitBtn">Log in</button>
    </form>
    <p class="auth-switch"><a href="#" id="forgotLink">Forgot password?</a></p>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <div class="auth-card" id="forgotCard" style="display:none;">
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
    <div class="alert alert-error" id="forgotError"></div>
    <div class="alert alert-success" id="forgotSuccess"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label">EMAIL ADDRESS</label>
        <input type="email" class="form-input" id="forgotEmail" required>
      </div>
      <button type="submit" class="form-submit" id="forgotSubmitBtn">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="#" id="backToLoginLink">Back to log in</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/password-toggle.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorAlert = document.getElementById('errorAlert');
  const submitBtn = document.getElementById('submitBtn');
  const rememberBox = document.getElementById('rememberMe');
  const REMEMBER_EMAIL_KEY = 'emphile_remembered_email';

  // Pre-fill the email if the user chose to be remembered last time
  try {
    const savedEmail = localStorage.getItem(REMEMBER_EMAIL_KEY);
    if (savedEmail) document.getElementById('email').value = savedEmail;
    rememberBox.checked = localStorage.getItem(REMEMBER_FLAG) !== '0';
  } catch (e) { /* storage unavailable */ }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorAlert.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Must be set before signing in so the new session is stored the right way
    try { localStorage.setItem(REMEMBER_FLAG, rememberBox.checked ? '1' : '0'); } catch (err) { /* ignore */ }

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      errorAlert.textContent = error.message;
      errorAlert.classList.add('show');
      return;
    }

    try {
      if (rememberBox.checked) localStorage.setItem(REMEMBER_EMAIL_KEY, email);
      else localStorage.removeItem(REMEMBER_EMAIL_KEY);
    } catch (err) { /* ignore */ }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('is_admin, is_staff')
      .eq('id', data.user.id)
      .single();

    window.location.href = redirectFor(profile);
  });

  function redirectFor(profile) {
    if (profile && profile.is_admin) return 'admin.html';
    if (profile && profile.is_staff) return 'staff-portal.html';
    return 'portal.html';
  }

  const loginCard = document.querySelector('.auth-card');
  const forgotCard = document.getElementById('forgotCard');
  const forgotForm = document.getElementById('forgotForm');
  const forgotError = document.getElementById('forgotError');
  const forgotSuccess = document.getElementById('forgotSuccess');
  const forgotSubmitBtn = document.getElementById('forgotSubmitBtn');

  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    loginCard.style.display = 'none';
    forgotCard.style.display = 'block';
  });

  document.getElementById('backToLoginLink').addEventListener('click', (e) => {
    e.preventDefault();
    forgotCard.style.display = 'none';
    loginCard.style.display = 'block';
  });

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    forgotError.classList.remove('show');
    forgotSuccess.classList.remove('show');
    forgotSubmitBtn.disabled = true;
    forgotSubmitBtn.textContent = 'Sending…';

    const email = document.getElementById('forgotEmail').value.trim();
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });

    forgotSubmitBtn.disabled = false;
    forgotSubmitBtn.textContent = 'Send reset link';

    if (error) {
      forgotError.textContent = error.message;
      forgotError.classList.add('show');
      return;
    }

    forgotSuccess.textContent = 'Check your email for a password reset link.';
    forgotSuccess.classList.add('show');
    forgotForm.reset();
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('is_admin, is_staff')
      .eq('id', session.user.id)
      .single();
    window.location.href = redirectFor(profile);
  })();
</script>
</body>
</html>
