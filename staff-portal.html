<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal | Emphile Cleaning Solutions Ltd</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
<style>
  .doc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .doc-label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .doc-status { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .doc-controls { display: flex; align-items: center; gap: 8px; }
  .doc-controls input[type="file"] { font-size: 12px; max-width: 160px; }
  .btn-view { font-size: 12px; color: var(--green-dk); font-weight: 600; text-decoration: none; }
  .btn-print {
    background: #fff; color: var(--green-dk); border: 1px solid var(--border-bright);
    padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .btn-print:hover { border-color: var(--green); }
  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block !important; position: absolute; top: 0; left: 0; width: 100%; padding: 20px; }
  }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-mark">EC</div>
    <span class="nav-logo-text">Emphile<small>STAFF PORTAL</small></span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>
<div class="portal-wrap">
  <div class="portal-header">
    <div>
      <h1 id="welcomeTitle">Welcome</h1>
      <p id="welcomeSub">Loading your jobs…</p>
    </div>
    <button class="btn-logout" id="logoutBtn">Log out</button>
  </div>
  <div id="content">
    <div class="loading-state">Loading your assigned jobs…</div>
  </div>
</div>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script>
  const welcomeTitle = document.getElementById('welcomeTitle');
  const welcomeSub = document.getElementById('welcomeSub');
  const content = document.getElementById('content');
  const logoutBtn = document.getElementById('logoutBtn');
  let staffName = '';
  let jobsById = {};
  let checklistsByJob = {};
  const openChecklistIds = new Set();

  const CHECKLIST_TEMPLATE = [
    { category: 'Pre-Service Preparation', tasks: [
      'Reviewed job scope and customer instructions',
      'Gathered required equipment, materials, and PPE',
      'Assessed site conditions and identified hazards',
    ]},
    { category: 'Cleaning Tasks', tasks: [
      'Dusted and wiped all surfaces',
      'Vacuumed and/or swept all floors',
      'Mopped and treated hard floor surfaces',
      'Sanitized and restocked restrooms',
      'Cleaned kitchen / break area (if applicable)',
      'Cleaned windows and glass surfaces (if applicable)',
      'Emptied trash and relined bins',
    ]},
    { category: 'Quality & Handover', tasks: [
      'Completed final walkthrough of all areas',
      'Confirmed no damage or issues to report',
      'Packed away equipment and left site tidy',
      'Notified customer/site contact of completion',
    ]},
  ];

  function buildDefaultChecklistItems() {
    const items = [];
    CHECKLIST_TEMPLATE.forEach((group) => {
      group.tasks.forEach((task) => items.push({ category: group.category, label: task, checked: false }));
    });
    return items;
  }

  function checklistStatusMeta(status) {
    switch (status) {
      case 'submitted': return { label: 'Awaiting inspection', cls: 'status-Submitted' };
      case 'approved': return { label: 'Approved', cls: 'status-Paid' };
      case 'rejected': return { label: 'Needs rework', cls: 'status-Overdue' };
      default: return { label: 'In progress', cls: 'status-Pending' };
    }
  }

  function fmtNaira(n) {
    return '₦' + Number(n).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function fmtTime(d) {
    if (!d) return '—';
    return new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDateTime(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    const user = session.user;

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('full_name, is_staff')
      .eq('id', user.id)
      .single();

    if (!profile || !profile.is_staff) {
      window.location.href = 'portal.html';
      return;
    }

    staffName = profile.full_name || user.email;
    welcomeTitle.textContent = 'Welcome, ' + staffName;
    welcomeSub.textContent = 'Here are the jobs assigned to you.';

    await loadJobs();
  })();

  async function loadJobs() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const user = session.user;

    const { data: jobs, error } = await supabaseClient
      .from('invoices')
      .select('id, customer_id, service_type, job_date, notes, job_status, clock_in_at, clock_out_at, completion_form_path, checklist_path, completion_form_uploaded_at, checklist_uploaded_at')
      .eq('assigned_staff_id', user.id)
      .order('job_date', { ascending: true });

    if (error) {
      content.innerHTML = '<div class="empty-state">Couldn\'t load your jobs right now. Please try again shortly.</div>';
      return;
    }

    if (!jobs || jobs.length === 0) {
      content.innerHTML = '<div class="empty-state">No jobs assigned to you yet.</div>';
      return;
    }

    const customerIds = [...new Set(jobs.map((j) => j.customer_id))];
    const { data: profiles } = await supabaseClient
      .from('profiles')
      .select('id, full_name, phone, address')
      .in('id', customerIds);
    const profilesById = {};
    (profiles || []).forEach((p) => { profilesById[p.id] = p; });

    jobsById = {};
    jobs.forEach((j) => { jobsById[j.id] = { ...j, customer: profilesById[j.customer_id] }; });

    const jobIds = jobs.map((j) => j.id);
    const { data: checklists } = await supabaseClient
      .from('job_checklists')
      .select('*')
      .in('invoice_id', jobIds);
    checklistsByJob = {};
    (checklists || []).forEach((c) => { checklistsByJob[c.invoice_id] = c; });
    jobs.forEach((j) => {
      if (!checklistsByJob[j.id]) {
        checklistsByJob[j.id] = {
          invoice_id: j.id, status: 'in_progress', items: buildDefaultChecklistItems(),
          staff_notes: '', submitted_at: null, inspection_result: null, inspection_notes: null,
        };
      }
    });

    const cards = jobs.map((job) => {
      const customer = profilesById[job.customer_id];
      const customerName = customer && customer.full_name ? customer.full_name : 'Customer';
      const address = customer && customer.address ? customer.address : 'No address on file';
      const phone = customer && customer.phone ? customer.phone : '—';

      let actionHtml = '';
      if (job.job_status === 'Completed') {
        actionHtml = '<span class="status-pill status-Paid">Completed</span>';
      } else if (job.clock_in_at && !job.clock_out_at) {
        actionHtml = '<button class="btn-pay" data-action="clockout" data-id="' + job.id + '">Clock Out &amp; Complete</button>';
      } else {
        actionHtml = '<button class="btn-pay" data-action="clockin" data-id="' + job.id + '">Clock In &amp; Start Job</button>';
      }

      const completionRow = docRow(job.id, 'completion', 'Job completion form', job.completion_form_path, job.completion_form_uploaded_at);
      const checklistRow = docRow(job.id, 'checklist', 'Checklist', job.checklist_path, job.checklist_uploaded_at);

      return `
        <div class="job-card">
          <div class="job-card-header">
            <div>
              <div class="job-service">${job.service_type}</div>
              <div class="job-customer">${customerName} &middot; ${phone}</div>
              <div class="job-address">${address}</div>
            </div>
            <span class="status-pill status-Pending">${job.job_status}</span>
          </div>
          <div class="job-meta">
            <span>Job date: ${fmtDate(job.job_date)}</span>
            <span>Clocked in: ${fmtTime(job.clock_in_at)}</span>
            <span>Clocked out: ${fmtTime(job.clock_out_at)}</span>
          </div>
          ${job.notes ? '<div class="job-notes">' + job.notes + '</div>' : ''}
          <div class="job-actions" style="justify-content:space-between;">
            <button type="button" class="btn-print" data-print="${job.id}">Print job sheet</button>
            ${actionHtml}
          </div>
          <div class="doc-list">
            ${completionRow}
            ${checklistRow}
          </div>
          ${renderChecklistPanel(job.id)}
        </div>
      `;
    }).join('');

    content.innerHTML = '<div class="job-list">' + cards + '</div>';

    content.querySelectorAll('[data-action="clockin"]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Clocking in…';
        await supabaseClient.from('invoices').update({
          clock_in_at: new Date().toISOString(),
          job_status: 'In Progress',
        }).eq('id', btn.getAttribute('data-id'));
        await loadJobs();
      });
    });

    content.querySelectorAll('[data-action="clockout"]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Clocking out…';
        await supabaseClient.from('invoices').update({
          clock_out_at: new Date().toISOString(),
          job_status: 'Completed',
        }).eq('id', btn.getAttribute('data-id'));
        await loadJobs();
      });
    });

    content.querySelectorAll('[data-print]').forEach((btn) => {
      btn.addEventListener('click', () => printJobSheet(btn.getAttribute('data-print')));
    });

    content.querySelectorAll('[data-upload-btn]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const jobId = btn.getAttribute('data-upload-btn');
        const docType = btn.getAttribute('data-doc-type');
        const fileInput = content.querySelector('[data-file-input="' + jobId + '-' + docType + '"]');
        if (fileInput.files.length > 0) uploadDocument(jobId, docType, fileInput.files[0], btn);
      });
    });

    content.querySelectorAll('[data-view]').forEach((link) => {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const path = link.getAttribute('data-view');
        const { data, error } = await supabaseClient.storage.from('job-documents').createSignedUrl(path, 3600);
        if (data && data.signedUrl) window.open(data.signedUrl, '_blank');
      });
    });

    content.querySelectorAll('[data-checklist-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-checklist-toggle');
        const block = btn.closest('.checklist-block');
        if (openChecklistIds.has(id)) { openChecklistIds.delete(id); block.classList.remove('open'); }
        else { openChecklistIds.add(id); block.classList.add('open'); }
      });
    });

    content.querySelectorAll('[data-checklist-item]').forEach((cb) => {
      cb.addEventListener('change', () => {
        const jobId = cb.getAttribute('data-checklist-item');
        const idx = Number(cb.getAttribute('data-idx'));
        checklistsByJob[jobId].items[idx].checked = cb.checked;
        const progressEl = content.querySelector('[data-checklist-progress="' + jobId + '"]');
        if (progressEl) {
          const state = checklistsByJob[jobId];
          const checkedCount = state.items.filter((i) => i.checked).length;
          progressEl.textContent = checkedCount + '/' + state.items.length + ' tasks completed';
        }
      });
    });

    content.querySelectorAll('[data-save-checklist]').forEach((btn) => {
      btn.addEventListener('click', () => saveChecklist(btn.getAttribute('data-save-checklist'), { submit: false }));
    });

    content.querySelectorAll('[data-submit-checklist]').forEach((btn) => {
      btn.addEventListener('click', () => saveChecklist(btn.getAttribute('data-submit-checklist'), { submit: true }));
    });
  }

  function renderChecklistItems(jobId, items, editable) {
    const categories = [];
    const byCat = {};
    items.forEach((it, idx) => {
      if (!byCat[it.category]) { byCat[it.category] = []; categories.push(it.category); }
      byCat[it.category].push({ ...it, idx });
    });
    return categories.map((cat) => `
      <div class="checklist-category">
        <div class="checklist-category-title">${cat}</div>
        ${byCat[cat].map((it) => `
          <label class="checklist-item">
            <input type="checkbox" data-checklist-item="${jobId}" data-idx="${it.idx}" ${it.checked ? 'checked' : ''} ${editable ? '' : 'disabled'}>
            <span>${it.label}</span>
          </label>
        `).join('')}
      </div>
    `).join('');
  }

  function renderChecklistPanel(jobId) {
    const state = checklistsByJob[jobId];
    const total = state.items.length;
    const checkedCount = state.items.filter((i) => i.checked).length;
    const meta = checklistStatusMeta(state.status);
    const editable = state.status === 'in_progress' || state.status === 'rejected';
    const isOpen = openChecklistIds.has(jobId);

    let noticeHtml = '';
    if (state.status === 'rejected') {
      noticeHtml = '<div class="checklist-notice rework"><strong>Needs rework:</strong> ' + (state.inspection_notes || 'The admin sent this back for corrections.') + '</div>';
    } else if (state.status === 'approved') {
      noticeHtml = '<div class="checklist-notice approved"><strong>Approved' + (state.inspection_result === 'pass_with_notes' ? ' with notes' : '') + '.</strong>' + (state.inspection_notes ? ' ' + state.inspection_notes : '') + '</div>';
    } else if (state.status === 'submitted') {
      noticeHtml = '<div class="checklist-notice pending">Submitted for inspection — awaiting admin review.</div>';
    }

    const actionsHtml = editable ? `
      <div class="checklist-actions">
        <button type="button" class="btn-print" data-save-checklist="${jobId}">Save progress</button>
        <button type="button" class="btn-pay" data-submit-checklist="${jobId}">Submit for inspection</button>
      </div>` : '';

    return `
      <div class="checklist-block${isOpen ? ' open' : ''}">
        <button type="button" class="checklist-toggle" data-checklist-toggle="${jobId}">
          <div>
            <div class="checklist-toggle-title">Quality Checklist</div>
            <div class="checklist-toggle-sub"><span data-checklist-progress="${jobId}">${checkedCount}/${total} tasks completed</span> &middot; <span class="status-pill ${meta.cls}">${meta.label}</span></div>
          </div>
          <svg class="chk-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="checklist-body">
          ${renderChecklistItems(jobId, state.items, editable)}
          <div class="form-group" style="margin-top:16px;">
            <label class="form-label">NOTES (OPTIONAL)</label>
            <textarea class="form-textarea" data-checklist-notes="${jobId}" ${editable ? '' : 'readonly'}>${state.staff_notes || ''}</textarea>
          </div>
          ${noticeHtml}
          ${actionsHtml}
        </div>
      </div>
    `;
  }

  async function saveChecklist(jobId, opts) {
    const submit = !!(opts && opts.submit);
    const state = checklistsByJob[jobId];
    const notesEl = content.querySelector('[data-checklist-notes="' + jobId + '"]');
    const notes = notesEl ? notesEl.value.trim() : (state.staff_notes || '');
    const total = state.items.length;
    const checkedCount = state.items.filter((i) => i.checked).length;

    if (submit && checkedCount < total) {
      const proceed = confirm((total - checkedCount) + ' task(s) are still unchecked. Submit for inspection anyway?');
      if (!proceed) return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();

    const payload = {
      invoice_id: jobId,
      staff_id: session.user.id,
      items: state.items,
      staff_notes: notes,
      status: submit ? 'submitted' : (state.status || 'in_progress'),
    };
    if (submit) {
      payload.submitted_at = new Date().toISOString();
      payload.inspected_by = null;
      payload.inspected_at = null;
      payload.inspection_result = null;
      payload.inspection_notes = null;
    }

    const { data, error } = await supabaseClient
      .from('job_checklists')
      .upsert(payload, { onConflict: 'invoice_id' })
      .select()
      .single();

    if (error) {
      alert('Could not save checklist: ' + error.message);
      return;
    }

    checklistsByJob[jobId] = data;
    openChecklistIds.add(jobId);
    await loadJobs();
  }

  function docRow(jobId, docType, label, path, uploadedAt) {
    const uploaded = !!path;
    const statusText = uploaded ? ('Uploaded ' + fmtDateTime(uploadedAt)) : 'Not uploaded yet';
    const viewLink = uploaded ? '<a href="#" class="btn-view" data-view="' + path + '">View</a>' : '';
    return `
      <div class="doc-row">
        <div>
          <div class="doc-label">${label}</div>
          <div class="doc-status">${statusText}</div>
        </div>
        <div class="doc-controls">
          ${viewLink}
          <input type="file" accept="image/*,.pdf" data-file-input="${jobId}-${docType}">
          <button type="button" class="btn-print" data-upload-btn="${jobId}" data-doc-type="${docType}">Upload</button>
        </div>
      </div>
    `;
  }

  async function uploadDocument(jobId, docType, file, btn) {
    btn.disabled = true;
    btn.textContent = 'Uploading…';

    const path = jobId + '/' + docType + '-' + Date.now() + '-' + file.name;
    const { error: uploadError } = await supabaseClient.storage.from('job-documents').upload(path, file);

    if (uploadError) {
      alert('Upload failed: ' + uploadError.message);
      btn.disabled = false;
      btn.textContent = 'Upload';
      return;
    }

    const columnPath = docType === 'completion' ? 'completion_form_path' : 'checklist_path';
    const columnTime = docType === 'completion' ? 'completion_form_uploaded_at' : 'checklist_uploaded_at';
    await supabaseClient.from('invoices').update({
      [columnPath]: path,
      [columnTime]: new Date().toISOString(),
    }).eq('id', jobId);

    await loadJobs();
  }

  function buildPrintChecklistHtml(jobId) {
    const state = checklistsByJob[jobId];
    if (!state || !state.items || state.items.length === 0) return '';

    const categories = [];
    const byCat = {};
    state.items.forEach((it) => {
      if (!byCat[it.category]) { byCat[it.category] = []; categories.push(it.category); }
      byCat[it.category].push(it);
    });
    const checkedCount = state.items.filter((i) => i.checked).length;
    const meta = checklistStatusMeta(state.status);

    const categoriesHtml = categories.map((cat) => `
      <div style="margin-bottom:10px;">
        <div style="font-size:11px;font-weight:bold;letter-spacing:0.04em;text-transform:uppercase;color:#0E7C4C;margin-bottom:4px;">${cat}</div>
        ${byCat[cat].map((it) => `<div style="font-size:13px;padding:2px 0;">${it.checked ? '&#9745;' : '&#9744;'} ${it.label}</div>`).join('')}
      </div>
    `).join('');

    const staffNotesHtml = state.staff_notes
      ? `<p style="font-size:13px;margin-top:10px;"><strong>Staff notes:</strong> ${state.staff_notes}</p>` : '';
    const inspectionHtml = (state.status === 'approved' || state.status === 'rejected') && state.inspection_notes
      ? `<p style="font-size:13px;margin-top:10px;"><strong>Inspection notes:</strong> ${state.inspection_notes}</p>` : '';

    return `
      <div style="margin-top:24px;border-top:1px solid #ccc;padding-top:16px;">
        <h2 style="font-size:15px;margin-bottom:4px;">Quality Checklist</h2>
        <p style="font-size:12px;color:#55665D;margin-bottom:12px;">${checkedCount}/${state.items.length} tasks completed &middot; Status: ${meta.label}</p>
        ${categoriesHtml}
        ${staffNotesHtml}
        ${inspectionHtml}
      </div>
    `;
  }

  async function printJobSheet(jobId) {
    const job = jobsById[jobId];
    if (!job) return;
    const customer = job.customer;
    const printArea = document.getElementById('printArea');
    const shortRef = 'JOB-' + jobId.slice(0, 8).toUpperCase();

    const qrText = 'Emphile Cleaning Solutions Ltd\n' +
      'Job: ' + shortRef + '\n' +
      'Service: ' + job.service_type + '\n' +
      'Customer: ' + (customer && customer.full_name ? customer.full_name : 'Customer') + '\n' +
      'Date: ' + fmtDate(job.job_date) + '\n' +
      'Staff: ' + staffName;
    printArea.innerHTML = `
      <div style="font-family: Arial, sans-serif; color: #10241B; max-width: 600px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
          <div>
            <h1 style="font-size:22px;margin-bottom:4px;">Emphile Cleaning Solutions Ltd</h1>
            <p style="font-size:13px;color:#55665D;">Job Sheet &middot; ${shortRef}</p>
          </div>
          <div id="jobQrBox" style="display:inline-block;"></div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:14px;">
          <tr><td style="padding:8px 0;font-weight:bold;width:160px;">Service</td><td>${job.service_type}</td></tr>
          <tr><td style="padding:8px 0;font-weight:bold;">Job date</td><td>${fmtDate(job.job_date)}</td></tr>
          <tr><td style="padding:8px 0;font-weight:bold;">Customer</td><td>${customer && customer.full_name ? customer.full_name : 'Customer'}</td></tr>
          <tr><td style="padding:8px 0;font-weight:bold;">Phone</td><td>${customer && customer.phone ? customer.phone : '—'}</td></tr>
          <tr><td style="padding:8px 0;font-weight:bold;">Address</td><td>${customer && customer.address ? customer.address : 'No address on file'}</td></tr>
          <tr><td style="padding:8px 0;font-weight:bold;">Assigned to</td><td>${staffName}</td></tr>
          <tr><td style="padding:8px 0;font-weight:bold;">Notes</td><td>${job.notes || '—'}</td></tr>
        </table>
        ${buildPrintChecklistHtml(jobId)}
        <div style="margin-top:24px;border-top:1px solid #ccc;padding-top:16px;">
          <p style="font-size:13px;margin-bottom:24px;">Staff signature: ______________________________</p>
          <p style="font-size:13px;">Customer signature: ______________________________</p>
        </div>
        <div style="margin-top:24px;border-top:1px solid #ccc;padding-top:16px;text-align:center;">
          <svg id="jobBarcode"></svg>
        </div>
      </div>
    `;
    try {
      if (typeof QRCode === 'undefined') throw new Error('QRCode library not loaded');
      new QRCode(document.getElementById('jobQrBox'), { text: qrText, width: 80, height: 80, correctLevel: QRCode.CorrectLevel.M });
    } catch (e) {
      console.error('QR code generation failed:', e);
    }
    try {
      if (typeof JsBarcode === 'undefined') throw new Error('JsBarcode library not loaded');
      JsBarcode('#jobBarcode', shortRef, { format: 'CODE128', width: 2, height: 40, displayValue: true, fontSize: 13, margin: 0 });
    } catch (e) {
      console.error('Barcode generation failed:', e);
    }
    window.print();
  }
</script>
</body>
</html>
